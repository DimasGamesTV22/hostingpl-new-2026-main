# GameDock — полная стек-развёртка одной командой
#
#   docker compose up -d
#
# Подходит для теста и для продакшена на выделенном сервере.
# Для продакшена на «голом» Debian используйте deploy/install.sh —
# он настраивает nginx, PHP-FPM, systemd и сертификат автоматически.
#
# Состав:
#   panel        — Laravel (nginx + php-fpm)
#   queue        — воркер очередей
#   scheduler    — планировщик (биллинг, алерты, бэкапы, cron-задачи)
#   wss          — WebSocket-сервер панели (связь с агентами)
#   bot          — Telegram-бот
#   agent        — локальный агент ноды (если эта машина ещё и нода)
#   mysql        — MariaDB 11
#   redis        — Redis 7
#   nginx-proxy  — единая точка входа (или внешний nginx)
#
# .env рядом с этим файлом — пример в .env.docker.example

name: gamedock

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-gamedock}
  DB_USERNAME: ${DB_USERNAME:-gamedock}
  DB_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в .env}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Укажите REDIS_PASSWORD в .env}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  MAIL_MAILER: ${MAIL_MAILER:-log}

x-app-volumes: &app-volumes
  - ./:/var/www/html
  - panel-storage:/var/www/html/storage
  - panel-cache:/var/www/html/bootstrap/cache

services:
  # ── Панель ───────────────────────────────────────────────────────────
  panel:
    build:
      context: .
      dockerfile: panel/docker/Dockerfile
    image: gamedock/panel:latest
    restart: unless-stopped
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [gamedock]

  # ── Воркер очередей ──────────────────────────────────────────────────
  queue:
    image: gamedock/panel:latest
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      panel:
        condition: service_started
    stop_grace_period: 30s
    networks: [gamedock]

  # ── Планировщик ──────────────────────────────────────────────────────
  scheduler:
    image: gamedock/panel:latest
    restart: unless-stopped
    command: php artisan schedule:work
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      panel:
        condition: service_started
    networks: [gamedock]

  # ── WSS-сервер (агенты подключаются сюда) ───────────────────────────
  wss:
    image: gamedock/panel:latest
    restart: unless-stopped
    command: php artisan gamedock:ws-server --host=0.0.0.0 --port=9222
    environment:
      <<: *app-env
      GD_AGENT_INBOUND: "true"
    volumes: *app-volumes
    depends_on:
      panel:
        condition: service_started
    ports:
      - "${WSS_PORT:-9222}:9222"
    networks: [gamedock]

  # ── Агент ноды (локальный) ──────────────────────────────────────────
  agent:
    image: gamedock/agent:latest
    restart: unless-stopped
    environment:
      GD_PANEL: ${APP_URL}
      GD_TOKEN: ${GD_AGENT_TOKEN:?Укажите токен ноды из панели в .env}
      GD_NODE_ID: ${GD_NODE_ID:-1}
      GD_RUNTIME: ${GD_RUNTIME:-docker}
      GD_SERVERS_ROOT: /home/gamedock/servers
      GD_BACKUPS_ROOT: /home/gamedock/backups
      GD_TEMPLATES_ROOT: /opt/gamedock/game-images
      GD_DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - ./agent:/app:ro
      - ./game-images:/opt/gamedock/game-images:ro
      - node-servers:/home/gamedock/servers
      - node-backups:/home/gamedock/backups
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      wss:
        condition: service_started
    networks: [gamedock]

  # ── Telegram-бот ─────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: bot/docker/Dockerfile
    image: gamedock/bot:latest
    restart: unless-stopped
    environment:
      GD_PANEL_API: ${APP_URL}
      GD_PANEL_TOKEN: ${GD_BOT_PANEL_TOKEN:?Укажите API-токен панели в .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./bot:/app:ro
    depends_on:
      panel:
        condition: service_started
    networks: [gamedock]

  # ── База данных ──────────────────────────────────────────────────────
  mysql:
    image: mariadb:11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=500
      - --innodb_buffer_pool_size=512M
      - --max_allowed_packet=64M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Укажите DB_ROOT_PASSWORD в .env}
      MARIADB_DATABASE: ${DB_DATABASE:-gamedock}
      MARIADB_USER: ${DB_USERNAME:-gamedock}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gamedock]

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save 900 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [gamedock]

  # ── Прокси (опционально) ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      APP_PORT: 8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - panel
    networks: [gamedock]

volumes:
  panel-storage:
  panel-cache:
  mysql-data:
  redis-data:
  node-servers:
  node-backups:

networks:
  gamedock:
    driver: bridge
